name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure MSVC Release
        shell: pwsh
        run: |
          $version = $null
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Tag '$($env:GITHUB_REF_NAME)' must be vMAJOR.MINOR.PATCH (e.g. v0.1.0)."
            }
          }

          $cmakeArgs = @("-S", ".", "-B", "build/release", "-G", "Ninja", "-DCMAKE_BUILD_TYPE=Release", "-DLINKPULSE_RELEASE_BUILD:BOOL=ON")
          if ($version) { $cmakeArgs += "-DLINKPULSE_VERSION:STRING=$version" }
          # Optional publisher pin for the in-app updater (repository variable).
          if ($env:LINKPULSE_UPDATE_SIGNER) { $cmakeArgs += "-DLINKPULSE_UPDATE_SIGNER:STRING=$env:LINKPULSE_UPDATE_SIGNER" }
          cmake @cmakeArgs
        env:
          LINKPULSE_UPDATE_SIGNER: ${{ vars.LINKPULSE_UPDATE_SIGNER }}

      - name: Build MSVC Release
        run: cmake --build build/release --config Release

      - name: Run MSVC Release tests
        run: ctest --test-dir build/release -C Release --output-on-failure

      - name: Sign application binary
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_PFX_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: ./packaging/sign-file.ps1 -Path "out\windows\linkpulse-tray.exe"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $issArgs = @("packaging\LinkPulse.iss")
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $installerVersion = $env:GITHUB_REF_NAME -replace '^v', ''
            $issArgs = @("/DMyAppVersion=$installerVersion", "packaging\LinkPulse.iss")
          }
          & ISCC.exe @issArgs
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Sign installer
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_PFX_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: ./packaging/sign-file.ps1 -Path "build\installer\LinkPulseSetup.exe"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "manual-$env:GITHUB_SHA" }
          $title = if ($env:GITHUB_REF_TYPE -eq "tag") { "LinkPulse $tag" } else { "LinkPulse development build" }

          & gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            & gh release upload $tag "build\installer\LinkPulseSetup.exe" --clobber
          } else {
            & gh release create $tag "build\installer\LinkPulseSetup.exe" --title $title --generate-notes --target $env:GITHUB_SHA
          }
