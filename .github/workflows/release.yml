name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure MSVC Release
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") {
            $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            "0.1.0"
          }
          cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release -DLINKPULSE_VERSION=$version

      - name: Build MSVC Release
        run: cmake --build build/release --config Release

      - name: Run MSVC Release tests
        run: ctest --test-dir build/release -C Release --output-on-failure

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $issArgs = @("packaging\LinkPulse.iss")
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $installerVersion = $env:GITHUB_REF_NAME -replace '^v', ''
            $issArgs = @("/DMyAppVersion=$installerVersion", "packaging\LinkPulse.iss")
          }
          & ISCC.exe @issArgs
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "manual-$env:GITHUB_SHA" }
          $title = if ($env:GITHUB_REF_TYPE -eq "tag") { "LinkPulse $tag" } else { "LinkPulse development build" }

          & gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            & gh release upload $tag "build\installer\LinkPulseSetup.exe" --clobber
          } else {
            & gh release create $tag "build\installer\LinkPulseSetup.exe" --title $title --generate-notes --target $env:GITHUB_SHA
          }
